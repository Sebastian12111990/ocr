name: ocr

services:
  postgres:
    image: postgres:18.4
    container_name: ocr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocr}
      POSTGRES_DB: ${POSTGRES_DB:-ocr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocr} -d ${POSTGRES_DB:-ocr}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  yolo:
    image: ultralytics/ultralytics:latest
    container_name: ocr-yolo
    working_dir: /workspace
    volumes:
      - ./services/yolo:/workspace
      - '${YOLO_IMAGENES_DIR:-D:\img_dataset}:/data/patentes:ro'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

volumes:
  postgres_data:
